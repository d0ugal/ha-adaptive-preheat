[project]
name = "ha-room-thermal-model"
version = "0.1.1"
description = "Generic Home Assistant integration that learns a physical thermal model per room and predicts preheat time."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "C4",      # comprehensions
    "PIE",     # misc idioms
    "PT",      # pytest style
    "PERF",    # perflint
    "RET",     # return statements
    "ASYNC",   # blocking calls in async code
    "ARG",     # unused arguments
    "S",       # bandit
    "T20",     # stray print
    "FURB",    # refurb
    "PLC0415", # imports outside top level
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "S101",    # assert is the point of tests and is used for type narrowing
    "RUF002",  # docstrings deliberately use the degree sign, middle dot and minus sign
    "RUF003",  # comments deliberately use the degree sign, middle dot and minus sign
    "RUF012",  # mutable class attributes are idiomatic in HA entities
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # command line tools print their output
"tests/**" = [
    "ARG001",  # fixtures requested for their side effects (fake_model, freezer)
    "ARG002",  # test doubles mirror the signature of the object they replace
]
"custom_components/room_thermal_model/rtm_core/synthetic.py" = [
    "S311",  # seeded random.Random generates reproducible synthetic data, not secrets
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "rtm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pyright]
pythonVersion = "3.13"
include = ["custom_components"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
# Home Assistant is not installed for type checking, so its base classes are unresolved and
# class keyword arguments such as `domain=` cannot be validated.
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
# rtm_core is pure Python (no Home Assistant imports), so hold it to the strict standard.
strict = ["custom_components/room_thermal_model/rtm_core"]
