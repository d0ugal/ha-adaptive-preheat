name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      # The threshold (fail_under) lives in pyproject.toml; pytest-cov fails the run below it.
      - name: Run the test suite with branch coverage
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Coverage"
              echo
              uv run coverage report --format=markdown --fail-under=0
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
